# Configuration 2: the service router enabled, the identity-service not.
# Registry traffic reaches the registry through https://api.example.com/registry
# while authentication stays on your existing upstream IdP.
#
# Requires: an Ingress controller watching the class named below, DNS for the
# API host, and a TLS Secret. No service mesh is needed.
#
# Replace api.example.com with your own API hostname throughout.
router:
  enabled: true
  # Setting apiUrl is what configures the deployed services. Leaving it empty
  # deploys the router without pointing any client at it.
  apiUrl: "https://api.example.com"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
    - host: api.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - api.example.com
      secretName: api-example-com-tls
identity:
  enabled: false
  # Left false, and the chart now says so out loud: with a gateway configured it renders
  # ISTARI_DIGITAL_IDENTITY_SERVICE_ENABLED: "false" for each service rather than omitting
  # the variable. The services fall back to their older identity flags when it is unset,
  # so an explicit false is what actually keeps authentication on your existing IdP.
  clientIntegration:
    enabled: false
