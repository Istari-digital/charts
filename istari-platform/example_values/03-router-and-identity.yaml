# Configuration 3: the service router and the identity-service both enabled.
#
# Read the Identity Service install guide first. The identity-service will not
# start without ISTARI_DIGITAL_IDENTITY_SERVICE_SIGNING_KEY, and its clients will
# not authenticate until their credentials are registered. Every credential has a
# generator shipped in the identity-service image: gen-signing-key,
# gen-client-credentials, gen-agent-credentials, plus register-client and
# register-agent to register them.
#
# The Secret named by identityService.secretName must already exist and carry the
# signing key, the database URL, and the client material. This chart registers
# clients; it does not create them.
#
# Replace api.example.com and identity.example.com with your own hostnames.
router:
  enabled: true
  apiUrl: "https://api.example.com"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
    - host: api.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - api.example.com
      secretName: api-example-com-tls
identityService:
  enabled: true
  # Pre-created Secret holding the signing key, database URL, and client material.
  secretName: "istari-identity-service"
  # Registration hook Jobs. Each fails the release if its keys are absent from
  # the Secret above, so enable a hook only once you have populated its inputs.
  identityRouterClientRegistration:
    enabled: true
  publicClientRegistration:
    enabled: false
    clients: []
  agentRegistration:
    enabled: false
    agents: []
  migrations:
    runAsJob: true
  ingress:
    enabled: true
    className: "nginx"
    hosts:
    - host: identity.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - identity.example.com
      secretName: identity-example-com-tls
