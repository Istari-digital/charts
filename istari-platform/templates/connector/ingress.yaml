{{- $serviceValues := .Values.connector -}}
{{- if and $serviceValues.enabled $serviceValues.ingress.enabled }}
{{- if ne (int $serviceValues.ingress.servicePort) 80 }}
{{- fail "connector.ingress.servicePort must be 80, the only port the connector Service exposes" }}
{{- end }}
{{- if not $serviceValues.ingress.hosts }}
{{- fail "connector.ingress.hosts must contain at least one entry when connector.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "connector.fullname" . | quote }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
    {{- with $serviceValues.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $serviceValues.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $serviceValues.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $serviceValues.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $serviceValues.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | quote }}
            backend:
              service:
                name: {{ include "connector.fullname" $ | quote }}
                port:
                  number: {{ $serviceValues.ingress.servicePort }}
          {{- end }}
    {{- end }}
{{- end }}
