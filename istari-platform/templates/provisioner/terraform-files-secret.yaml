{{- if and .Values.provisioner.enabled (eq (include "provisioner.anyClientEnabled" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provisioner.terraformFilesSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # before-hook-creation only — the weight-1 Job mounts this for its whole run.
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  versions.tf: |
{{ .Files.Get "terraform/provisioner/versions.tf" | indent 4 }}
  backend.tf: |
{{ .Files.Get "terraform/provisioner/backend.tf" | indent 4 }}
  variables.tf: |
{{ .Files.Get "terraform/provisioner/variables.tf" | indent 4 }}
  main.tf: |
{{ .Files.Get "terraform/provisioner/main.tf" | indent 4 }}
  .terraform.lock.hcl: |
{{ .Files.Get "terraform/provisioner/.terraform.lock.hcl" | indent 4 }}
  terraform.tfvars: |
    namespace                            = {{ .Release.Namespace | quote }}
    registry_enabled                     = {{ .Values.provisioner.clients.registry.enabled }}
    secure_connection_enabled            = {{ .Values.provisioner.clients.secureConnection.enabled }}
    frontend_enabled                     = {{ .Values.provisioner.clients.frontend.enabled }}
    mcp_enabled                          = {{ .Values.provisioner.clients.mcp.enabled }}
    registry_secret_name                 = {{ include "provisioner.registrySecretName" . | quote }}
    secure_connection_secret_name        = {{ include "provisioner.secureConnectionSecretName" . | quote }}
    frontend_secret_name                 = {{ include "provisioner.frontendSecretName" . | quote }}
    mcp_secret_name                      = {{ include "provisioner.mcpSecretName" . | quote }}
    identity_service_clients_secret_name = {{ include "provisioner.serviceClientsSecretName" . | quote }}
    main_domain                          = {{ .Values.provisioner.mainDomain | quote }}
    identity_service_url                 = {{ .Values.provisioner.identityServiceUrl | quote }}
    frontend_redirect_uri                = {{ .Values.provisioner.clients.frontend.redirectUri | quote }}
    frontend_extra_redirect_uris         = [{{- range $i, $u := .Values.provisioner.clients.frontend.extraRedirectUris }}{{ if $i }}, {{ end }}{{ $u | quote }}{{- end }}]
    mcp_redirect_uri                     = {{ .Values.provisioner.clients.mcp.redirectUri | quote }}
    mcp_extra_redirect_uris              = [{{- range $i, $u := .Values.provisioner.clients.mcp.extraRedirectUris }}{{ if $i }}, {{ end }}{{ $u | quote }}{{- end }}]
    common_labels                        = {
      {{- range $k, $v := (include "provisioner.labels" $ | fromYaml) }}
      {{ $k | quote }} = {{ $v | quote }}
      {{- end }}
    }
{{- end }}
