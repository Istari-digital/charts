{{- if and .Values.provisioner.enabled (eq (include "provisioner.anyClientEnabled" .) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "provisioner.jobName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: {{ if .Values.provisioner.autoCleanupSuccessfulJob }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ .Values.provisioner.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "provisioner.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "provisioner.fullname" . | quote }}
      {{- with .Values.provisioner.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default $.Values.imagePullSecrets .Values.provisioner.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: provisioner
        image: {{ printf "%s/%s:%s" .Values.provisioner.registry .Values.provisioner.image .Values.provisioner.tag | quote }}
        imagePullPolicy: {{ .Values.provisioner.imagePullPolicy | quote }}
        {{- with .Values.provisioner.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ["/bin/bash", "/terraform/entrypoint.sh"]
        env:
        - name: TF_PLAN_ONLY
          value: {{ .Values.provisioner.planOnly | quote }}
        - name: TF_BACKEND_SECRET_SUFFIX
          value: {{ .Values.provisioner.backend.secretSuffix | quote }}
        - name: TF_BACKEND_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        {{- with .Values.provisioner.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.provisioner.extraEnvSecrets }}
        envFrom:
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: terraform-files
          mountPath: /terraform
        - name: terraform-temp
          mountPath: /terraform/.terraform
        {{- with .Values.provisioner.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      # A Kubernetes Secret volume is always mounted read-only at the kernel/mount level,
      # regardless of the pod's securityContext/fsGroup or any `readOnly` field here -- fsGroup
      # only affects ownership bits, it cannot make the mount itself writable. terraform init
      # must create .terraform/, so that one directory is a separate writable emptyDir layered on
      # top, matching istari-zitadel-configurator's job.yaml (terraform-temp). podSecurityContext's
      # fsGroup still matters -- it's what makes that emptyDir group-writable by the nonroot user.
      - name: terraform-files
        secret:
          secretName: {{ include "provisioner.terraformFilesSecretName" . | quote }}
      - name: terraform-temp
        emptyDir: {}
      {{- with .Values.provisioner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provisioner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provisioner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
