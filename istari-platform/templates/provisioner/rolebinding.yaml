{{- if and .Values.provisioner.enabled (eq (include "provisioner.anyClientEnabled" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "provisioner.fullname" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
  annotations:
    # See serviceaccount.yaml for why this is a hook.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "provisioner.fullname" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "provisioner.fullname" . | quote }}
    namespace: {{ .Release.Namespace }}
{{- end }}
