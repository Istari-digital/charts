{{- if and .Values.provisioner.enabled (or .Values.provisioner.clients.registry.enabled .Values.provisioner.clients.frontend.enabled .Values.provisioner.clients.mcp.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "provisioner.fullname" . | quote }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  # Lets the image read its own ServiceAccount's uid to set it as the ownerReference on the
  # Secrets it creates, so they are garbage-collected when the SA is deleted on uninstall. The
  # owner is the SA, not the Job -- the Job is replaced on every input change.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: [{{ include "provisioner.fullname" . | quote }}]
    verbs: ["get"]
{{- end }}
