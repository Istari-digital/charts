{{- if and .Values.provisioner.enabled (eq (include "provisioner.anyClientEnabled" .) "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "provisioner.fullname" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
  annotations:
    # Earlier hook than job.yaml's weight-1 Job -- matches identity.serviceaccount.yaml's
    # precedent: on a fresh install, Helm runs ALL hooks before ANY normal resources, so this
    # ServiceAccount must be a hook too (a plain resource would not exist yet when the Job starts).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    {{- with .Values.provisioner.serviceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
