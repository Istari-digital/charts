{{- /*
Chart-wide preconditions. This file deliberately has no leading underscore, so Helm evaluates it on
every render and these fail calls cannot be skipped by disabling a service. It emits no manifest.
*/ -}}
{{- if not (trim .Values.common.mainFqdn) }}
{{- fail "common.mainFqdn is required: set it to the platform's frontend FQDN (e.g. `common.mainFqdn: istari.example.com`). Every platform host and URL the chart emits derives from it, so an empty value renders a non-functional release." }}
{{- end }}
{{- /* The common.* hosts are scheme-less: the chart adds `https://` and paths where it emits a URL.
A value carrying a scheme or path (a common migration mistake) would render e.g.
`https://https://api.example.com` or corrupt a callback URI, so reject it here naming the key. */ -}}
{{- range $key := list "mainFqdn" "apiFqdnOverride" "mcpFqdnOverride" }}
{{- $val := trim (index $.Values.common $key) }}
{{- if and $val (contains "/" $val) }}
{{- fail (printf "common.%s must be a scheme-less host (e.g. `api.example.com`), not a URL or path — got %q. Drop the scheme and any trailing path; the chart adds `https://` where it emits a URL." $key $val) }}
{{- end }}
{{- end }}
{{- /* Provisioner images before 0.4.0 never write the identity-keys Secret identity mounts. Only a
full semver tag is checked; <0.4.0-0 also rejects older prereleases. */ -}}
{{- $provisionerTag := toString .Values.provisioner.tag }}
{{- if and .Values.provisioner.enabled .Values.identity.enabled (regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$" $provisionerTag) (semverCompare "<0.4.0-0" $provisionerTag) }}
{{- fail (printf "provisioner.tag %q is too old for identity: images before 0.4.0 do not generate the identity service's keys, so its pods cannot start. Set provisioner.tag to 0.4.0 or later." $provisionerTag) }}
{{- end }}
{{- /* none is read only from identity.oidc.provider; the idp-migration hook reads identity.env first. */ -}}
{{- range $e := .Values.identity.env }}
{{- if and (eq (toString $e.name) "ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER") (eq (toString $e.value) "none") }}{{- fail "identity.env sets ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER to none: set identity.oidc.provider: none instead, which the whole chart reads" }}{{- end }}
{{- end }}
{{- /* Guards, not defaults: values reused from an older chart lack these maps. */ -}}
{{- $clientIntegration := false }}
{{- with .Values.identity.clientIntegration }}{{- $clientIntegration = .enabled }}{{- end }}
{{- /* Without client integration these clients authenticate against Zitadel, which signs nobody in here. */ -}}
{{- if and (eq (toString .Values.identity.oidc.provider) "none") (not $clientIntegration) (or .Values.fileservice.enabled .Values.frontend.enabled .Values.mcp.enabled) }}
{{- fail "identity.oidc.provider is \"none\", so identity.clientIntegration.enabled must be true: without it registry-service, the frontend and MCP still authenticate against Zitadel" }}
{{- end }}
{{- /* Without the gateway the chart sets no identity-service settings on the clients and no API URL on identity. */ -}}
{{- if and (eq (toString .Values.identity.oidc.provider) "none") (not .Values.apiGateway.enabled) (or .Values.fileservice.enabled .Values.frontend.enabled .Values.mcp.enabled .Values.identity.enabled .Values.secureConnection.enabled) }}
{{- fail "identity.oidc.provider is \"none\", so apiGateway.enabled must be true: without the API gateway the chart gives registry-service, the frontend and MCP no identity-service settings, and identity-service cannot accept the Secure Connection Service's token" }}
{{- end }}
{{- /* A single release can see whether the Secure Connection Service's agent is declared; its Secrets it cannot. */ -}}
{{- if and (eq (toString .Values.identity.oidc.provider) "none") .Values.identity.enabled .Values.secureConnection.enabled }}
{{- $declared := false }}
{{- with .Values.identity.agentRegistration }}
{{- if .enabled }}
{{- range $agent := .agents }}
{{- if has "secure_connector" (default list $agent.platformRoles) }}{{- $declared = true }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $declared }}
{{- fail "identity.oidc.provider is \"none\" and secureConnection.enabled is true, so identity.agentRegistration must register the Secure Connection Service's agent with platformRoles [secure_connector]: see the chart README's section on installing with no identity provider" }}
{{- end }}
{{- end }}
{{- /* Only a full semver tag is checked; <X-0 also lets X's prereleases through. */ -}}
{{- $identityTag := toString .Values.identity.tag }}
{{- if and .Values.identity.enabled (eq (toString .Values.identity.oidc.provider) "none") (regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$" $identityTag) (semverCompare "<2.4.0-0" $identityTag) }}
{{- fail (printf "identity.tag %q is too old for identity.oidc.provider: none: identity-service images before 2.4.0 cannot start without an identity provider or create the first platform admin. Set identity.tag to 2.4.0 or later." $identityTag) }}
{{- end }}
