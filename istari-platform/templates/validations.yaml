{{- /*
Chart-wide validations that must fire regardless of which services this release
enables. Unlike a `_helpers.tpl` `define`, which only runs where something
`include`s it, a template file without a leading underscore is evaluated on
every render, so an unconditional `fail` here cannot be skipped by disabling a
service. This file never emits a manifest.
*/}}
{{- /* A per-service release can't see a gateway another release deploys, so only a whole-platform release is checked. */ -}}
{{- if and (include "istari-platform.identityEnabled" .) (not (include "istari-platform.apiGatewayEnabled" .)) (not (include "istari-platform.apiGatewayUrl" .)) .Values.fileservice.enabled .Values.frontend.enabled }}
{{- fail "identity.enabled is true but apiGateway.enabled is false and no gateway URL resolves — identity-service is reached through the API Gateway: enable apiGateway, or set apiGateway.apiUrl to the URL of a gateway deployed by another release, or set both identity.enabled and apiGateway.enabled to false to run without identity" }}
{{- end }}
{{- if and (eq (include "istari-platform.identityClientIntegration" .) "true") (not (include "istari-platform.apiGatewayUrl" .)) }}
{{- fail "identity.clientIntegration.enabled is set to true but no gateway URL resolves — set apiGateway.apiUrl so the registry service, the frontend, and MCP have a gateway to authenticate through" }}
{{- end }}

{{- /*
provisioner.clients.frontend/.mcp flip on the same identity-enabled env var that
identity.clientIntegration.enabled does (VITE_ISTARI_DIGITAL_IDENTITY_SERVICE_ENABLED /
ISTARI_DIGITAL_IDENTITY_SERVICE_ENABLED), independent of that flag -- so a THIS-RELEASE
frontend/mcp workload needs the same gateway-URL guard, or it installs a workload that fails
at startup. Scoped to frontend.enabled/mcp.enabled too (not just the provisioner client flag):
a dedicated provisioner release that only generates/registers credentials for a workload
deployed in a SEPARATE release (one-release-per-service topology) never runs that workload
here, so it has no need for apiGateway.apiUrl itself.
*/}}
{{- if and (include "provisioner.clientEnabled" (list . "frontend")) .Values.frontend.enabled (not (include "istari-platform.apiGatewayUrl" .)) }}
{{- fail "provisioner.clients.frontend.enabled and frontend.enabled are both true but no gateway URL resolves — set apiGateway.apiUrl so the frontend has a gateway to authenticate through" }}
{{- end }}
{{- if and (include "provisioner.clientEnabled" (list . "mcp")) .Values.mcp.enabled (not (include "istari-platform.apiGatewayUrl" .)) }}
{{- fail "provisioner.clients.mcp.enabled and mcp.enabled are both true but no gateway URL resolves — set apiGateway.apiUrl so MCP has a gateway to authenticate through" }}
{{- end }}
{{- if and (include "provisioner.enabled" .) (not .Values.provisioner.adoptExisting) (not .Values.provisioner.mainDomain) (not .Values.provisioner.identityServiceUrl) (or (include "provisioner.clientEnabled" (list . "registry")) (include "provisioner.clientEnabled" (list . "frontend")) (include "provisioner.clientEnabled" (list . "secureConnection"))) }}
{{- fail "provisioner.adoptExisting is false, so the provisioner mints every client, but no domain is set — set provisioner.mainDomain (or provisioner.identityServiceUrl)" }}
{{- end }}
