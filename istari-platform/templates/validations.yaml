{{- /*
Chart-wide preconditions. This file deliberately has no leading underscore, so Helm evaluates it on
every render and these fail calls cannot be skipped by disabling a service. It emits no manifest.
*/ -}}
{{- if not (trim .Values.common.mainFqdn) }}
{{- fail "common.mainFqdn is required: set it to the platform's frontend FQDN (e.g. `common.mainFqdn: istari.example.com`). Every platform host and URL the chart emits derives from it, so an empty value renders a non-functional release." }}
{{- end }}
{{- /* The common.* hosts are scheme-less: the chart adds `https://` and paths where it emits a URL.
A value carrying a scheme or path (a common migration mistake) would render e.g.
`https://https://api.example.com` or corrupt a callback URI, so reject it here naming the key. */ -}}
{{- range $key := list "mainFqdn" "apiFqdnOverride" "mcpFqdnOverride" }}
{{- $val := trim (index $.Values.common $key) }}
{{- if and $val (contains "/" $val) }}
{{- fail (printf "common.%s must be a scheme-less host (e.g. `api.example.com`), not a URL or path — got %q. Drop the scheme and any trailing path; the chart adds `https://` where it emits a URL." $key $val) }}
{{- end }}
{{- end }}
{{- /* The identity pod mounts the provisioner's identity-keys Secret, which images before 0.4.0
never write, so an older retained tag (an override, or `helm upgrade --reuse-values`) would leave
identity in ContainerCreating. Only a semver tag is checked. */ -}}
{{- $provisionerTag := toString .Values.provisioner.tag }}
{{- if and .Values.provisioner.enabled .Values.identity.enabled (regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+" $provisionerTag) (semverCompare "<0.4.0" $provisionerTag) }}
{{- fail (printf "provisioner.tag %q is too old for identity: images before 0.4.0 do not generate the identity service's keys, so its pods cannot start. Set provisioner.tag to 0.4.0 or later." $provisionerTag) }}
{{- end }}
