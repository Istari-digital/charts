{{- $serviceValues := .Values.identity -}}
{{- $registration := dig "registryClientRegistration" dict $serviceValues -}}
{{- $registrationPodAnnotations := dig "podAnnotations" dict $registration -}}
{{- $registrationPodLabels := dig "podLabels" dict $registration -}}
{{- $registrationResources := dig "resources" dict $registration -}}
{{- $autoCleanupSuccessfulJob := dig "autoCleanupSuccessfulJob" true $registration -}}
{{- $registrationEnabled := dig "enabled" false $registration -}}
{{- /* Extra env for the register-client container, rendered after the service-level
       env so it wins on duplicate names — e.g. to correct OTEL k8s.container.name off
       the fanned-in service value. */ -}}
{{- $registrationEnv := dig "env" list $registration -}}
{{- if and $serviceValues.enabled $registrationEnabled }}
{{- $_ := $serviceValues.secretName | required "identity.secretName must be non-empty when identity.registryClientRegistration.enabled is true" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.registryClientRegistration.jobName" . | quote }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    istari.digital/job-type: "client-registration"
    istari.digital/client: "registry"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ if $autoCleanupSuccessfulJob }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ dig "backoffLimit" 6 $registration | int }}
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
        istari.digital/job-type: "client-registration"
        istari.digital/client: "registry"
        {{- with $registrationPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        sidecar.istio.io/inject: "false"
        {{- with $registrationPodAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "identity.fullname" . | quote }}
      # The Job only talks to PostgreSQL; it never needs the Kubernetes API.
      automountServiceAccountToken: false
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: register-client
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "/register-client"
        # $(VAR) is expanded by Kubernetes from the env vars below, so the DB URL
        # never appears in plaintext in the pod manifest. The registry client blob
        # is public-key material (no private key), but is wired the same way.
        args:
        - "-secret"
        - "$(REGISTRY_CLIENT_PUBLIC_KEY_BLOB)"
        - "-database-url"
        - "$(DATABASE_URL)"
        {{- /* Every env var — the required secret-backed vars first, then service env, then job
        env — flows through containerEnv, so the whole list (identity blocks included) is deduped
        last-wins to one patchable entry per name; a user override of DATABASE_URL et al. therefore
        wins cleanly instead of producing a duplicate. The secret vars lead so args' $(VAR) refs are
        defined; kubelet expands args against the full env set irrespective of order. otelDefaults
        false: this Job does not initialize the OTEL SDK, so the chart sets no OTEL_* default. */}}
        {{- $secretEnv := list
            (dict "name" "REGISTRY_CLIENT_PUBLIC_KEY_BLOB" "valueFrom" (dict "secretKeyRef" (dict "name" $serviceValues.secretName "key" "ISTARI_DIGITAL_IDENTITY_SERVICE_REGISTRY_CLIENT")))
            (dict "name" "DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" $serviceValues.secretName "key" "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL"))) }}
        {{- $extra := list $secretEnv }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- with $registrationEnv }}{{- $extra = append $extra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "identity" "subservice" "register-client" "containerName" "register-client" "otelDefaults" false "extra" $extra) | nindent 8 }}
        {{- with $registrationResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
