{{- /*
We put the generated default env vars in this config map so that user-defined values of
'identity.secretName', 'identity.extraEnvSecrets', and 'identity.env' will always override them.
*/}}
{{- $serviceValues := .Values.identity -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{- if (include "istari-platform.identityEnabled" $) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.configmap.name" . | quote }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  {{- if dig "migrations" "runAsJob" false $serviceValues }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    # Keeps a plain helm upgrade from deleting it once it leaves the release manifest for a hook.
    helm.sh/resource-policy: keep
  {{- end }}
data:
  ISTARI_DIGITAL_REGISTRY_SERVICE_URL: {{ printf "http://%s" (include "fileservice.fullname" .) | quote }}
  {{- /* identity-service registers the registry, frontend and mcp clients at startup from these;
  derived here from serviceClients when the chart renders them, so identity.secretName still wins. */}}
  {{- $provisioning := $serviceValues.serviceClientProvisioning }}
  {{- if and $provisioning.enabled (not $provisioning.configMapName) }}
  {{- range $provisioning.serviceClients }}
  {{- if and (eq .serviceId "registry") (eq .kind "service") .credential }}
  ISTARI_DIGITAL_IDENTITY_SERVICE_REGISTRY_PUBLIC_KEY_B64: {{ (.credential | b64dec | fromJson).key | b64enc | quote }}
  {{- else if and (eq .serviceId "frontend") (eq .kind "public") .redirectUris }}
  ISTARI_DIGITAL_IDENTITY_SERVICE_FRONTEND_REDIRECT_URIS: {{ join "," .redirectUris | quote }}
  {{- else if and (eq .serviceId "mcp") (eq .kind "public") .redirectUris }}
  ISTARI_DIGITAL_IDENTITY_SERVICE_MCP_REDIRECT_URIS: {{ join "," .redirectUris | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if dig "enabled" false (default dict .Values.jaeger) }}
  {{- /* the Identity Service uses the OTLP/HTTP exporter → target Jaeger's 4318, not the gRPC 4317
  fileservice uses. Per-container OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES are set as
  explicit env by "istari-platform.workloadIdentityEnv": the resource attributes reference
  downward-API $(VAR)s, which envFrom cannot expand, so they cannot live here. */}}
  ISTARI_DIGITAL_IDENTITY_SERVICE_OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpHttpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
  {{- if $gatewayUrl }}
  # identity is reached publicly at <base>/identity through the API Gateway.
  # BASE_URL and JWT_ISSUER default from this only when unset; an explicit value
  # wins, so an environment that sets them keeps its direct issuer.
  ISTARI_DIGITAL_API_URL: {{ $gatewayUrl | quote }}
  # Accept the gateway-prefixed audience for RFC 7523 client assertions, in
  # addition to the canonical JWT_ISSUER, which is always accepted. Legacy-compat:
  # the service logs a warning on every non-canonical match.
  ISTARI_DIGITAL_IDENTITY_SERVICE_ADDITIONAL_ASSERTION_AUDIENCES: {{ printf "%s/identity" $gatewayUrl | quote }}
  {{- end }}
{{- end }}
