{{- /*
We put the generated default env vars in this config map so that user-defined values of
'identity.secretName', 'identity.extraEnvSecrets', and 'identity.env' will always override them.
*/}}
{{- $serviceValues := .Values.identity -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{- if $serviceValues.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.configmap.name" . | quote }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  {{- if dig "migrations" "runAsJob" false $serviceValues }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    {{- /* Stops Helm pruning this object as "removed from the release" when an upgrade turns it into a hook.
    Without it, an upgrade that switches runAsJob to true deletes the ConfigMap and identity pods cannot start. */}}
    helm.sh/resource-policy: keep
  {{- end }}
data:
  {{- include "istari-platform.internalServiceUrls" . | nindent 2 }}
  ISTARI_DIGITAL_REGISTRY_SERVICE_URL: {{ printf "http://%s" (include "fileservice.fullname" .) | quote }}
  # identity-service exits at startup without an allowlist; the frontend's origin is the one browser caller.
  ISTARI_DIGITAL_IDENTITY_SERVICE_CORS_ALLOWED_ORIGINS: {{ include "istari-platform.frontendRedirectUri" . | quote }}
  {{- if dig "enabled" false (default dict .Values.jaeger) }}
  {{- /* the Identity Service uses the OTLP/HTTP exporter → target Jaeger's 4318, not the gRPC 4317
  fileservice uses. Per-container OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES are set as
  explicit env by "istari-platform.workloadIdentityEnv": the resource attributes reference
  downward-API $(VAR)s, which envFrom cannot expand, so they cannot live here. */}}
  ISTARI_DIGITAL_IDENTITY_SERVICE_OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpHttpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
  {{- if .Values.apiGateway.enabled }}
  # identity derives its gateway-prefixed assertion audience from this directly. Emitted only
  # when the API Gateway is enabled, since that is the host clients reach this URL through.
  ISTARI_DIGITAL_API_URL: {{ $gatewayUrl | quote }}
  {{- end }}
  {{- if or .Values.provisioner.enabled .Values.provisioner.external }}
  {{- /* The frontend/mcp OIDC redirect allowlists are chart-derivable (from common.*), so they come
  from this ConfigMap rather than only the provisioner Secret. The registry public key the identity
  service also needs is generated and still mounts from the provisioner Secret. */}}
  {{- with include "istari-platform.frontendRedirectUri" . }}
  ISTARI_DIGITAL_IDENTITY_SERVICE_FRONTEND_REDIRECT_URIS: {{ . | quote }}
  {{- end }}
  {{- /* The connector service signs users in through MCP's client, so its callback joins MCP's
  allowlist (a comma-separated list) when it is enabled. */}}
  {{- $mcpRedirectUris := compact (list (include "istari-platform.mcpRedirectUri" .)) }}
  {{- if .Values.connector.enabled }}
  {{- $mcpRedirectUris = append $mcpRedirectUris (printf "%s/auth/callback" (include "istari-platform.connectorUrl" .)) }}
  {{- end }}
  {{- with $mcpRedirectUris }}
  ISTARI_DIGITAL_IDENTITY_SERVICE_MCP_REDIRECT_URIS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
