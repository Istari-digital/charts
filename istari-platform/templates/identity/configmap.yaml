{{- /*
We put the generated default env vars in this config map so that user-defined values of
'identity.secretName', 'identity.extraEnvSecrets', and 'identity.env' will always override them.
*/}}
{{- $serviceValues := .Values.identity -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{- if $serviceValues.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.configmap.name" . | quote }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  {{- if dig "migrations" "runAsJob" false $serviceValues }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
  {{- end }}
data:
  ISTARI_DIGITAL_REGISTRY_SERVICE_URL: {{ printf "http://%s" (include "fileservice.fullname" .) | quote }}
  {{- if dig "enabled" false (default dict .Values.jaeger) }}
  {{- /* the Identity Service uses the OTLP/HTTP exporter → target Jaeger's 4318, not the gRPC 4317
  fileservice uses. Per-container OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES are set as
  explicit env by "istari-platform.workloadIdentityEnv": the resource attributes reference
  downward-API $(VAR)s, which envFrom cannot expand, so they cannot live here. */}}
  ISTARI_DIGITAL_IDENTITY_SERVICE_OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpHttpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
  {{- if $gatewayUrl }}
  # identity derives its gateway-prefixed assertion audience from this directly (identity-service#194).
  ISTARI_DIGITAL_API_URL: {{ $gatewayUrl | quote }}
  {{- end }}
{{- end }}
