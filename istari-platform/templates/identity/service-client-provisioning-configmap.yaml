{{- /*
ConfigMap of PUBLIC client blobs the provision-service-clients Job registers.
Public keys are not secret, so they ride in a ConfigMap rather than the Secret.
The packaging layer (Terraform / gen-client-credentials) generates each keypair
and distributes the PRIVATE blob to the owning service's Secret; only the public
halves are listed here. Rendered as a pre-install/pre-upgrade hook (weight 19) so
it exists before the weight-20 provisioning Job that mounts it.
*/ -}}
{{- $serviceValues := .Values.identity -}}
{{- $provisioning := $serviceValues.serviceClientProvisioning -}}
{{- /* Chart renders the ConfigMap only when it owns it (no external configMapName) AND no Secret
       source (explicit secretName, or the provisioner's auto-derived output) would win instead --
       see identity.serviceClientProvisioning.secretName. Without this, an effective-Secret release
       would still render, validate, and create an unused ConfigMap the Job never mounts. */ -}}
{{- $secretName := include "identity.serviceClientProvisioning.secretName" . -}}
{{- if and $serviceValues.enabled $provisioning.enabled (not $provisioning.configMapName) (not $secretName) $provisioning.serviceClients }}
{{- /* Validate each chart-owned entry at render time (mirrors provision-service-clients'
       own validation), so a malformed entry fails `helm template` rather than the hook Job
       after the release has already begun. */ -}}
{{- range $sc := $provisioning.serviceClients }}
{{- if not $sc.serviceId }}{{ fail "identity.serviceClientProvisioning.serviceClients: an entry is missing serviceId" }}{{ end }}
{{- if not (has $sc.kind (list "service" "agent" "public")) }}{{ fail (printf "identity.serviceClientProvisioning.serviceClients %q: kind must be service|agent|public, got %q" $sc.serviceId $sc.kind) }}{{ end }}
{{- if and (eq $sc.kind "agent") (not $sc.tenantSlug) }}{{ fail (printf "identity.serviceClientProvisioning.serviceClients %q: tenantSlug is required for kind=agent" $sc.serviceId) }}{{ end }}
{{- if and (eq $sc.kind "public") (not $sc.clientId) }}{{ fail (printf "identity.serviceClientProvisioning.serviceClients %q: clientId is required for kind=public" $sc.serviceId) }}{{ end }}
{{- if and (eq $sc.kind "public") (not $sc.redirectUris) }}{{ fail (printf "identity.serviceClientProvisioning.serviceClients %q: redirectUris is required for kind=public" $sc.serviceId) }}{{ end }}
{{- if and (ne $sc.kind "public") (not $sc.credential) }}{{ fail (printf "identity.serviceClientProvisioning.serviceClients %q: credential is required for kind=%s" $sc.serviceId $sc.kind) }}{{ end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.serviceClientProvisioning.configMapName" . | quote }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    istari.digital/job-type: "service-client-provisioning"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "19"
    {{- /* before-hook-creation only (never hook-succeeded): the weight-20 Job mounts this,
           so it must survive the whole hook run; it is replaced on the next upgrade. */}}
    helm.sh/hook-delete-policy: before-hook-creation
data:
  # The provision-service-clients -config file: a serviceClients list of public
  # blobs. Rendered verbatim from identity.serviceClientProvisioning.serviceClients.
  serviceClients.yaml: |-
{{ dict "serviceClients" $provisioning.serviceClients | toYaml | indent 4 }}
{{- end }}
