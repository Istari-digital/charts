{{- $serviceValues := .Values.identity -}}
{{- $idp := dig "idpMigration" dict $serviceValues -}}
{{- $oidc := $serviceValues.oidc -}}
{{- $from := dig "from" "zitadel" $idp -}}
{{- /* The incoming provider is the one identity-service runs after the upgrade: idpMigration.to, else
       identity.oidc.provider, else zitadel (identity-service's own default). A deployment that stays on
       the outgoing provider needs the import, so it runs unless enabled is explicitly false; switching
       providers still takes enabled=true. */ -}}
{{- /* identity.env overrides identity.oidc.provider in the Deployment, last entry winning, so it does here too. */ -}}
{{- $providerEntry := dict -}}
{{- range $e := $serviceValues.env }}
{{- if eq (toString $e.name) "ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER" }}{{- $providerEntry = $e -}}{{- end }}
{{- end }}
{{- $envProvider := toString (default "" $providerEntry.value) -}}
{{- if and $serviceValues.enabled (or $providerEntry.valueFrom (contains "$(" $envProvider)) (not $idp.to) (ne (toString (index $idp "enabled")) "false") }}{{ fail "identity.env sets ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER through valueFrom or a $(VAR) reference, which the chart cannot read: set identity.idpMigration.to to the provider identity-service runs (zitadel to import, or the incoming provider to switch), or identity.idpMigration.enabled=false" }}{{ end }}
{{- $incoming := $idp.to | default $envProvider | default $oidc.provider | default "zitadel" -}}
{{- $import := eq $incoming $from -}}
{{- $idpEnabled := index $idp "enabled" -}}
{{- $render := ternary (ne (toString $idpEnabled) "false") (eq (toString $idpEnabled) "true") $import -}}
{{- if and $serviceValues.enabled $render }}
{{- $runAsJob := dig "runAsJob" false (dig "migrations" dict $serviceValues) -}}
{{- /* A migration runs against the schema the weight-5 db-migrate hook leaves, which exists only with
       runAsJob=true; with runAsJob=false migrations run as a Deployment initContainer, after all hooks.
       The import migrates the schema itself in an init container instead. */ -}}
{{- if and (not $import) (not $runAsJob) }}{{ fail "switching identity providers with identity.idpMigration requires identity.migrations.runAsJob=true, so DB migrations run as a pre-upgrade hook (weight 5) before this weight-10 migrate-idp hook; with runAsJob=false migrations run as a Deployment initContainer (after the hooks) and migrate-idp would run against a missing schema" }}{{ end }}
{{- $migrationsEnv := $serviceValues.migrations.env -}}
{{- $migrationsResources := $serviceValues.migrations.resources -}}
{{- $idpBackoff := dig "backoffLimit" 3 $idp -}}
{{- $idpCleanup := dig "autoCleanupSuccessfulJob" true $idp -}}
{{- $idpPodAnnotations := dig "podAnnotations" dict $idp -}}
{{- $idpPodLabels := dig "podLabels" dict $idp -}}
{{- $idpEnv := dig "env" list $idp -}}
{{- $idpResources := dig "resources" dict $idp -}}
{{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) -}}
{{- /* Only zitadel enumeration is implemented; forwarding any other value would
       fail migrate-idp after the upgrade has already started. Reject it here. */ -}}
{{- if ne $from "zitadel" }}{{ fail (printf "identity.idpMigration.from must be \"zitadel\" (the only supported outgoing IdP), got %q" $from) }}{{ end }}
{{- $fromIssuer := dig "fromIssuer" "" $idp -}}
{{- if $import }}
{{- /* Staying on Zitadel, the outgoing issuer is identity-service's own, from identity.oidc.issuer, a
       mounted Secret or identity.env. The kubelet's $(VAR) expansion reads the same sources, envFrom included. */ -}}
{{- $fromIssuer = $fromIssuer | default "$(ISTARI_DIGITAL_IDENTITY_SERVICE_OIDC_ISSUER)" -}}
{{- else }}
{{- $fromIssuer = required "identity.idpMigration.fromIssuer is required when identity.idpMigration.enabled=true (the outgoing IdP issuer, still reachable at pre-upgrade time)" $fromIssuer -}}
{{- $_ := required (printf "identity.idpMigration.to is required to switch identity providers (identity.oidc.provider is %q); set it to the incoming provider, e.g. keycloak" $incoming) $idp.to -}}
{{- end }}
{{- $fromIssuerApiUrl := $idp.fromIssuerApiUrl -}}
{{- /* scheme, optional userinfo, a non-empty host (name, IPv4 or bracketed IPv6), optional port, optional path */ -}}
{{- if and $fromIssuerApiUrl (not (regexMatch `^https?://([^/?#@[:space:]]+@)?([^/?#@:\[\][:space:]]+|\[[0-9A-Fa-f:.]+\])(:[0-9]+)?(/[^[:space:]]*)?$` $fromIssuerApiUrl)) }}{{ fail (printf "identity.idpMigration.fromIssuerApiUrl must be an absolute http(s) URL, got %q" $fromIssuerApiUrl) }}{{ end }}
{{- $idpExtraEnvSecrets := $idp.extraEnvSecrets -}}
{{- /* required guards an EXPLICIT empty override (dig still supplies the default when the key is
       absent): an empty -database-url-env / -credential-env would pass through to migrate-idp and
       fail only at runtime, after the upgrade has begun. Fail at render instead. */ -}}
{{- $dbEnv := required "identity.idpMigration.databaseUrlEnv must not be empty (the env var name holding the PostgreSQL connection string)" (dig "databaseUrlEnv" "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL" $idp) -}}
{{- $credEnv := required "identity.idpMigration.credentialEnv must not be empty (the env var name holding the outgoing-IdP credential)" (dig "credentialEnv" "ISTARI_DIGITAL_IDENTITY_SERVICE_ZITADEL_MANAGER_KEY" $idp) -}}
{{- $slugPrefix := dig "slugPrefix" "" $idp -}}
{{- $dryRun := dig "dryRun" false $idp -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.fullname" . }}-idp-migrate
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    # A provider switch has nothing to migrate on a fresh install. The import runs on
    # install too: identity-service needs the configurator's Secret, so the configurator,
    # and its default organization, exist by then. Weight 10 runs after the db-migrate
    # hook (weight 5) and before agent registration (weight 20).
    helm.sh/hook: {{ if $import }}pre-install,pre-upgrade{{ else }}pre-upgrade{{ end }}
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ if $idpCleanup }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ $idpBackoff | int }}
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
        {{- with $idpPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "istari-platform.jobPodAnnotations" $idpPodAnnotations | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "identity.fullname" . | quote }}
      # migrate-idp talks to PostgreSQL and the outgoing IdP only — never the
      # Kubernetes API — so it has no need for a mounted SA token.
      automountServiceAccountToken: false
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if not $runAsJob }}
      initContainers:
      - name: db-migrate
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "/migrate"
        {{- with $migrationsResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        {{- /* With runAsJob=false the chart ConfigMap is an ordinary release resource, absent during the
        upgrade that first enables identity-service; neither CLI reads its keys, so the hook may start without it. */}}
        - configMapRef:
            name: {{ include "identity.configmap.name" . | quote }}
            {{- if not $runAsJob }}
            optional: true
            {{- end }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- range $s := $idpExtraEnvSecrets }}
        - secretRef:
            name: {{ $s | quote }}
            optional: true
        {{- end }}
        {{- $initExtra := list }}
        {{- with $serviceValues.env }}{{- $initExtra = append $initExtra . }}{{- end }}
        {{- with $migrationsEnv }}{{- $initExtra = append $initExtra . }}{{- end }}
        {{- with $idpEnv }}{{- $initExtra = append $initExtra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $initExtra = append $initExtra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        {{- /* /migrate reads only the default variable: set it from a custom databaseUrlEnv, last, so the $(VAR) it expands is defined first. */}}
        {{- if ne $dbEnv "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL" }}
        {{- $lastByName := dict }}
        {{- range $frag := $initExtra }}{{- range $e := $frag }}{{- $_ := set $lastByName (toString $e.name) $e }}{{- end }}{{- end }}
        {{- range $n, $e := $lastByName }}
        {{- if and (ne $n "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL") (contains "$(ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL)" (toString (default "" $e.value))) }}{{ fail (printf "%s references $(ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL), but with identity.migrations.runAsJob=false and identity.idpMigration.databaseUrlEnv=%s the /migrate init container redefines that variable from $(%s), so the reference cannot resolve. Leave databaseUrlEnv at its default, or give %s the connection string directly" $n $dbEnv $dbEnv $dbEnv) }}{{ end }}
        {{- end }}
        {{- $kept := list }}
        {{- range $frag := $initExtra }}{{- $f := list }}{{- range $e := $frag }}{{- if ne (toString $e.name) "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL" }}{{- $f = append $f $e }}{{- end }}{{- end }}{{- $kept = append $kept $f }}{{- end }}
        {{- $initExtra = append $kept (list (dict "name" "ISTARI_DIGITAL_IDENTITY_SERVICE_DATABASE_URL" "value" (printf "$(%s)" $dbEnv))) }}
        {{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "identity" "subservice" "db-migrate" "containerName" "db-migrate" "otelDefaults" $jaegerEnabled "extra" $initExtra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
      - name: idp-migrate
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "/migrate-idp"
        - "-from"
        - {{ $from | quote }}
        - "-issuer"
        - {{ $fromIssuer | quote }}
        {{- with $fromIssuerApiUrl }}
        - "-issuer-api-url"
        - {{ . | quote }}
        {{- end }}
        {{- if $import }}
        - "-mode"
        - "import"
        {{- else }}
        - "-mode"
        - "migrate"
        - "-to"
        - {{ $incoming | quote }}
        {{- end }}
        - "-database-url-env"
        - {{ $dbEnv | quote }}
        - "-credential-env"
        - {{ $credEnv | quote }}
        {{- if $slugPrefix }}
        - "-slug-prefix"
        - {{ $slugPrefix | quote }}
        {{- end }}
        {{- if $dryRun }}
        - "-dry-run"
        {{- end }}
        {{- with $idpResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- /* Inherit the app's config + secrets: the DB URL and outgoing-IdP credential the CLIs read via -*-env indirection come from these, so there are no new plaintext env vars. */}}
        envFrom:
        {{- /* With runAsJob=false the chart ConfigMap is an ordinary release resource, absent during the
        upgrade that first enables identity-service; neither CLI reads its keys, so the hook may start without it. */}}
        - configMapRef:
            name: {{ include "identity.configmap.name" . | quote }}
            {{- if not $runAsJob }}
            optional: true
            {{- end }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- range $s := $idpExtraEnvSecrets }}
        - secretRef:
            name: {{ $s | quote }}
            optional: true
        {{- end }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order (service env, then idpMigration.env, then cert) and deduped last-wins, so later
        fragments override earlier ones and a repeated name collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- /* As in the Deployment: identity.oidc.* first, so identity.env still overrides it. */}}
        {{- if $import }}{{- $extra = append $extra (include "identity.oidcEnv" $serviceValues | fromYamlArray) }}{{- end }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- with $idpEnv }}{{- $extra = append $extra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "identity" "subservice" "idp-migrate" "containerName" "idp-migrate" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
