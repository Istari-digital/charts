{{- $serviceValues := .Values.identity -}}
{{- $idp := $serviceValues.idpMigration -}}
{{- $oidc := $serviceValues.oidc -}}
{{- $from := $idp.from -}}

{{- /* Match the Deployment's last-entry-wins environment overrides. */ -}}
{{- $providerEntry := dict -}}
{{- range $entry := $serviceValues.env -}}
  {{- if eq (toString $entry.name) "ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER" -}}
    {{- $providerEntry = $entry -}}
  {{- end -}}
{{- end -}}
{{- $hasProviderOverride := hasKey $providerEntry "name" -}}
{{- $envProvider := toString (default "" $providerEntry.value) -}}
{{- $providerUnresolved := or (not (empty $providerEntry.valueFrom)) (contains "$(" $envProvider) -}}
{{- $providerKnown := not (empty $oidc.provider) -}}
{{- $effectiveProvider := $oidc.provider -}}
{{- if $hasProviderOverride -}}
  {{- $providerKnown = not $providerUnresolved -}}
  {{- $effectiveProvider = $envProvider -}}
  {{- /* An empty explicit override replaces oidc.provider and selects the default import path. */ -}}
  {{- if not $effectiveProvider -}}
    {{- $effectiveProvider = $from -}}
  {{- end -}}
{{- end -}}

{{- /* A Secret-only provider is unknown to Helm; without an explicit target, preserve the automatic import. */ -}}
{{- $incoming := $idp.to -}}
{{- if and (not $incoming) $providerKnown -}}
  {{- $incoming = $effectiveProvider -}}
{{- end -}}
{{- if not $incoming -}}
  {{- $incoming = $from -}}
{{- end -}}
{{- $import := eq $incoming $from -}}
{{- $hookDisabled := eq (toString $idp.enabled) "false" -}}
{{- $hookRequested := eq (toString $idp.enabled) "true" -}}
{{- $render := $import -}}
{{- if $hookRequested -}}
  {{- $render = true -}}
{{- end -}}
{{- if or (not $serviceValues.enabled) $hookDisabled -}}
  {{- $render = false -}}
{{- end -}}

{{- if and $serviceValues.enabled (not $hookDisabled) -}}
  {{- if and $providerUnresolved (not $idp.to) -}}
    {{- fail "identity.env sets ISTARI_DIGITAL_IDENTITY_SERVICE_IDP_PROVIDER through valueFrom or a $(VAR) reference, which the chart cannot read: set identity.idpMigration.to to the provider identity-service runs (zitadel to import, or the incoming provider to switch), or identity.idpMigration.enabled=false" -}}
  {{- end -}}
  {{- if $idp.to -}}
    {{- if not (has $idp.to (list "zitadel" "keycloak" "entra" "okta" "pingfederate")) -}}
      {{- fail (printf "identity.idpMigration.to must be one of zitadel (the import), keycloak, entra, okta, pingfederate; google and lastwall require explicit subject mapping with identity.idpMigration.enabled=false, got %q" $idp.to) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- if $render -}}
{{- /* A hook must prepare the provider the Deployment will use; Secret-only inputs cannot be compared here. */ -}}
{{- if and $idp.to $providerKnown -}}
  {{- if ne $effectiveProvider $idp.to -}}
    {{- fail (printf "identity.idpMigration.to must match the effective literal provider %q from identity.env or identity.oidc.provider; align the provider settings or set identity.idpMigration.enabled=false" $effectiveProvider) -}}
  {{- end -}}
{{- end -}}
{{- /* Deployment init containers run after Helm hooks, so this hook needs the schema migration Job first. */ -}}
{{- if not $serviceValues.migrations.runAsJob -}}
  {{- fail "identity.idpMigration requires identity.migrations.runAsJob=true so the database schema exists before the IdP hook; set identity.migrations.runAsJob=true or identity.idpMigration.enabled=false" -}}
{{- end -}}
{{- /* Only Zitadel enumeration is implemented in migrate-idp. */ -}}
{{- if ne $from "zitadel" -}}
  {{- fail (printf "identity.idpMigration.from must be \"zitadel\" (the only supported outgoing IdP), got %q" $from) -}}
{{- end -}}
{{- $fromIssuer := $idp.fromIssuer -}}
{{- if $import -}}
  {{- /* Kubelet expands this from the same OIDC configuration and Secrets mounted by the Deployment. */ -}}
  {{- if not $fromIssuer -}}
    {{- $fromIssuer = "$(ISTARI_DIGITAL_IDENTITY_SERVICE_OIDC_ISSUER)" -}}
  {{- end -}}
{{- else -}}
  {{- $fromIssuer = required "identity.idpMigration.fromIssuer is required when identity.idpMigration.enabled=true (the outgoing IdP issuer, still reachable at pre-upgrade time)" $fromIssuer -}}
  {{- $_ := required (printf "identity.idpMigration.to is required to switch identity providers (identity.oidc.provider is %q); set it to the incoming provider, e.g. keycloak" $incoming) $idp.to -}}
{{- end -}}
{{- $idpBackoff := $idp.backoffLimit -}}
{{- $idpCleanup := $idp.autoCleanupSuccessfulJob -}}
{{- $idpPodAnnotations := $idp.podAnnotations -}}
{{- $idpPodLabels := $idp.podLabels -}}
{{- $idpEnv := $idp.env -}}
{{- $idpResources := $idp.resources -}}
{{- $jaegerEnabled := .Values.jaeger.enabled -}}
{{- $idpExtraEnvSecrets := $idp.extraEnvSecrets -}}
{{- /* Empty env-var names would fail migrate-idp only after the upgrade has begun. */ -}}
{{- $dbEnv := required "identity.idpMigration.databaseUrlEnv must not be empty (the env var name holding the PostgreSQL connection string)" $idp.databaseUrlEnv -}}
{{- $credEnv := required "identity.idpMigration.credentialEnv must not be empty (the env var name holding the outgoing-IdP credential)" $idp.credentialEnv -}}
{{- $slugPrefix := $idp.slugPrefix -}}
{{- $dryRun := $idp.dryRun -}}
{{- if $import }}
{{- /* migrate-idp reads the API base URL only from -issuer-api-url, and an unset $(VAR) would pass through
       as literal text. This defines it as empty, which migrate-idp treats as unset; every later source overrides it. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.fullname" . }}-idp-migrate-defaults
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  ISTARI_DIGITAL_IDENTITY_SERVICE_OIDC_API_BASE_URL: ""
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.fullname" . }}-idp-migrate
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    # A provider switch has nothing to migrate on a fresh install. The import runs on
    # install too: identity-service needs the configurator's Secret, so the configurator,
    # and its default organization, exist by then. Weight 10 runs after the db-migrate
    # hook (weight 5) and before agent registration (weight 20).
    helm.sh/hook: {{ if $import }}pre-install,pre-upgrade{{ else }}pre-upgrade{{ end }}
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ if $idpCleanup }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ $idpBackoff | int }}
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
        {{- with $idpPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "istari-platform.jobPodAnnotations" $idpPodAnnotations | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "identity.fullname" . | quote }}
      # migrate-idp talks to PostgreSQL and the outgoing IdP only — never the
      # Kubernetes API — so it has no need for a mounted SA token.
      automountServiceAccountToken: false
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: idp-migrate
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "/migrate-idp"
        - "-from"
        - {{ $from | quote }}
        - "-issuer"
        - {{ $fromIssuer | quote }}
        {{- if $import }}
        - "-issuer-api-url"
        - "$(ISTARI_DIGITAL_IDENTITY_SERVICE_OIDC_API_BASE_URL)"
        - "-mode"
        - "import"
        {{- else }}
        - "-mode"
        - "migrate"
        - "-to"
        - {{ $incoming | quote }}
        {{- end }}
        - "-database-url-env"
        - {{ $dbEnv | quote }}
        - "-credential-env"
        - {{ $credEnv | quote }}
        {{- if $slugPrefix }}
        - "-slug-prefix"
        - {{ $slugPrefix | quote }}
        {{- end }}
        {{- if $dryRun }}
        - "-dry-run"
        {{- end }}
        {{- with $idpResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- /* Inherit the app's config + secrets: the DB URL and outgoing-IdP credential the CLIs read via -*-env indirection come from these, so there are no new plaintext env vars. */}}
        envFrom:
        {{- if $import }}
        - configMapRef:
            name: {{ printf "%s-idp-migrate-defaults" (include "identity.fullname" .) | quote }}
        {{- end }}
        - configMapRef:
            name: {{ include "identity.configmap.name" . | quote }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- range $s := $idpExtraEnvSecrets }}
        - secretRef:
            name: {{ $s | quote }}
            optional: true
        {{- end }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order (service env, then idpMigration.env, then cert) and deduped last-wins, so later
        fragments override earlier ones and a repeated name collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- /* As in the Deployment: identity.oidc.* first, so identity.env still overrides it. */}}
        {{- if $import }}{{- $extra = append $extra (include "identity.oidcEnv" $serviceValues | fromYamlArray) }}{{- end }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- with $idpEnv }}{{- $extra = append $extra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "identity" "subservice" "idp-migrate" "containerName" "idp-migrate" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
