{{- $serviceValues := .Values.fileservice -}}
{{- $migrationsEnv := dig "migrations" "env" list $serviceValues -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{- if $serviceValues.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fileservice.fullname" . | quote }}
  labels:
    {{- include "fileservice.labels" . | nindent 4 }}
  {{- with $serviceValues.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $serviceValues.autoscaling.enabled }}
  replicas: {{ $serviceValues.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fileservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $serviceValues.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fileservice.labels" . | nindent 8 }}
        {{- with $serviceValues.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fileservice.fullname" . | quote }}
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: "istari-platform"
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        ports:
        - containerPort: 8000
          name: "http"
          protocol: "TCP"
        livenessProbe:
          failureThreshold: 30
          httpGet:
            path: "/api/v2/health/liveness"
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 8
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          failureThreshold: 30
          httpGet:
            path: "/api/v2/health/readiness"
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 8
          successThreshold: 1
          timeoutSeconds: 10
        {{- with $serviceValues.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) }}
        {{- if or $serviceValues.secretName $serviceValues.extraEnvSecrets $serviceValues.extraEnvConfigMaps $jaegerEnabled $gatewayUrl }}
        envFrom:
        {{- end }}
        {{- /* Chart defaults FIRST so the user's ConfigMaps, Secret(s), and explicit env override them */}}
        {{- if or $jaegerEnabled $gatewayUrl }}
        - configMapRef:
            name: {{ include "fileservice.configmap.name" . | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- $natsEnabled := .Values.nats.enabled }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order and the list is deduped last-wins, so service env overrides a chart default and a
        repeated name collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- if $natsEnabled }}{{- $extra = append $extra (include "istari-platform.fileservice.natsEnv" . | fromYamlArray) }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "registry" "subservice" "web" "containerName" "istari-platform" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if not (dig "migrations" "runAsJob" false $serviceValues) }}
      initContainers:
      - name: "init-db"
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "poetry"
        - "run"
        - "alembic"
        - "upgrade"
        - "head"
        {{- if or $serviceValues.secretName $serviceValues.extraEnvSecrets $serviceValues.extraEnvConfigMaps $jaegerEnabled $gatewayUrl }}
        envFrom:
        {{- end }}
        {{- /* Chart defaults FIRST so the user's ConfigMaps, Secret(s), and explicit env override them */}}
        {{- if or $jaegerEnabled $gatewayUrl }}
        - configMapRef:
            name: {{ include "fileservice.configmap.name" . | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order (service env, then migrations.env, then nats/cert) and deduped last-wins, so later
        fragments override earlier ones and a repeated name collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- with $migrationsEnv }}{{- $extra = append $extra . }}{{- end }}
        {{- if $natsEnabled }}{{- $extra = append $extra (include "istari-platform.fileservice.natsEnv" . | fromYamlArray) }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "registry" "subservice" "init-db" "containerName" "init-db" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
