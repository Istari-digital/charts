{{- $serviceValues := .Values.fileservice -}}
{{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{/*
Chart-owned env for the registry service. The internal service URLs make this ConfigMap render
whenever the registry is enabled; the Jaeger and gateway/identity blocks below stay feature-gated.
Referenced FIRST in the consumers' `envFrom` so the user's Secret(s) and `fileservice.env` override
every value here (precedence contract: see the `jaeger:` section comment in values.yaml).
*/}}
{{- if $serviceValues.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fileservice.configmap.name" . | quote }}
  labels:
    {{- include "fileservice.labels" . | nindent 4 }}
  {{- /* Deliberately NOT a Helm hook: hook resources carry no release ownership, so they are
  never pruned on uninstall and go stale. The pre-install migration Job instead marks its
  reference to this ConfigMap `optional` (see migration-job.yaml). */}}
data:
  {{- include "istari-platform.internalServiceUrls" . | nindent 2 }}
  {{- if $jaegerEnabled }}
  FILE_SERVICE_OPENTELEMETRY_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  {{- /* Per-container OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES are set as explicit env by
  "istari-platform.workloadIdentityEnv": the resource attributes reference downward-API $(VAR)s,
  which envFrom cannot expand, so they cannot live here. */}}
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
  {{- if .Values.apiGateway.enabled }}
  # The registry uses this only to derive the identity URL when
  # FILE_SERVICE_IDENTITY_ROUTER_URL is unset (settings.py); an explicit
  # identity URL still wins.
  ISTARI_DIGITAL_API_URL: {{ $gatewayUrl | quote }}
  # The platform-wide identity toggle, rendered in BOTH polarities. The registry reads
  # it as a tri-state (settings.py): unset leaves the deprecated
  # FILE_SERVICE_FEATURE_FLAGS__IDENTITY_ROUTER_ENABLED authoritative, so an explicit
  # "false" is the only way this chart can turn identity off where that legacy flag is
  # set. "Gateway on, identity off" is a supported state - registry traffic through the
  # gateway, OIDC straight to your existing IdP - so the chart must be able to say it.
  ISTARI_DIGITAL_IDENTITY_SERVICE_ENABLED: {{ dig "clientIntegration" "enabled" false .Values.identity | quote }}
  {{- end }}
{{- end }}
