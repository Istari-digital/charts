{{- $serviceValues := .Values.fileservice -}}
{{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) -}}
{{- $gatewayUrl := include "istari-platform.gatewayUrl" . -}}
{{/*
Chart-owned env for the registry service, covering two independent things: the default OTEL
exporters for in-cluster Jaeger APM, and the DPLAT-602 gateway and identity variables. Either one
alone renders this ConfigMap, which is why the gate below tests both. Referenced FIRST in the
consumers' `envFrom` so the user's Secret(s) and `fileservice.env` override every value here
(precedence contract: see the `jaeger:` section comment in values.yaml).
*/}}
{{- if and $serviceValues.enabled (or $jaegerEnabled $gatewayUrl) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fileservice.configmap.name" . | quote }}
  labels:
    {{- include "fileservice.labels" . | nindent 4 }}
  {{- /* Deliberately NOT a Helm hook: hook resources carry no release ownership, so they are
  never pruned on uninstall and go stale. The pre-install migration Job instead marks its
  reference to this ConfigMap `optional` (see migration-job.yaml). */}}
data:
  {{- if $jaegerEnabled }}
  FILE_SERVICE_OPENTELEMETRY_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  {{- /* Web-container identity; init-db/db-migrate override via "istari-platform.otelWorkloadEnv".
  `istari-platform` is the main container's actual name in the Pod spec. */}}
  OTEL_SERVICE_NAME: "registry.web"
  OTEL_RESOURCE_ATTRIBUTES: "k8s.container.name=istari-platform"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
  {{- with $gatewayUrl }}
  # DPLAT-602. The registry uses this only to derive the identity URL when
  # FILE_SERVICE_IDENTITY_ROUTER_URL is unset (settings.py); an explicit
  # identity URL still wins.
  ISTARI_DIGITAL_API_URL: {{ . | quote }}
  {{- if dig "clientIntegration" "enabled" false $.Values.identity }}
  # The platform-wide toggle. When set it wins over the deprecated nested
  # FILE_SERVICE_FEATURE_FLAGS__IDENTITY_ROUTER_ENABLED, which environments may
  # still set; both agree on "true", so this only changes which name is authoritative.
  ISTARI_DIGITAL_IDENTITY_SERVICE_ENABLED: "true"
  {{- end }}
  {{- end }}
{{- end }}
