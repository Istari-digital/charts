{{- $serviceValues := .Values.fileservice -}}
{{- $gatewayUrl := include "istari-platform.apiGatewayUrl" . -}}
{{- $migrationsRunAsJob := dig "migrations" "runAsJob" false $serviceValues -}}
{{- $migrationsAutoCleanupSuccessfulJob := dig "migrations" "autoCleanupSuccessfulJob" true $serviceValues -}}
{{- $migrationsPodAnnotations := dig "migrations" "podAnnotations" dict $serviceValues -}}
{{- $migrationsPodLabels := dig "migrations" "podLabels" dict $serviceValues -}}
{{- $migrationsBackoffLimit := dig "migrations" "backoffLimit" 0 $serviceValues -}}
{{- $migrationsEnv := dig "migrations" "env" list $serviceValues -}}
{{- if and $serviceValues.enabled $migrationsRunAsJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fileservice.fullname" . }}-db-migrate
  labels:
    {{- include "fileservice.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: {{ if $migrationsAutoCleanupSuccessfulJob }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ $migrationsBackoffLimit | int }}
  template:
    metadata:
      labels:
        {{- include "fileservice.labels" . | nindent 8 }}
        {{- with $migrationsPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $migrationsPodAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "fileservice.fullname" . | quote }}
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: db-migrate
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "poetry"
        - "run"
        - "alembic"
        - "upgrade"
        - "head"
        {{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) }}
        {{- if or $serviceValues.secretName $serviceValues.extraEnvSecrets $serviceValues.extraEnvConfigMaps $jaegerEnabled $gatewayUrl }}
        envFrom:
        {{- end }}
        {{- /* OTEL/gateway defaults FIRST so the user's ConfigMaps, Secret(s), and explicit env override them.
        optional: rendered as a plain resource, so this pre-install/pre-upgrade hook Job runs
        before it exists whenever this release hasn't applied it yet — first install, the first
        upgrade that enables Jaeger or the gateway, or a ConfigMap rename */}}
        {{- if or $jaegerEnabled $gatewayUrl }}
        - configMapRef:
            name: {{ include "fileservice.configmap.name" . | quote }}
            optional: true
        {{- end }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- $natsEnabled := .Values.nats.enabled }}
        {{- /* Chart identity blocks FIRST (always present); user env AFTER so it wins on
        duplicate names; migrations.env after service env; the whole list is then deduped
        last-wins so a repeated name collapses to one patchable entry. */}}
        {{- $env := include "istari-platform.workloadIdentityEnv" (dict "service" "registry" "subservice" "db-migrate" "containerName" "db-migrate" "jaegerEnabled" $jaegerEnabled) | fromYamlArray }}
        {{- with $serviceValues.env }}{{- $env = concat $env . }}{{- end }}
        {{- with $migrationsEnv }}{{- $env = concat $env . }}{{- end }}
        {{- if $natsEnabled }}{{- $env = concat $env (include "istari-platform.fileservice.natsEnv" . | fromYamlArray) }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $env = concat $env (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.dedupeEnv" $env | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
