{{- $serviceValues := .Values.secureConnection -}}
{{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) -}}
{{- $migrationsRunAsJob := dig "migrations" "runAsJob" false $serviceValues -}}
{{- $migrationsAutoCleanupSuccessfulJob := dig "migrations" "autoCleanupSuccessfulJob" true $serviceValues -}}
{{- $migrationsPodAnnotations := dig "migrations" "podAnnotations" dict $serviceValues -}}
{{- $migrationsPodLabels := dig "migrations" "podLabels" dict $serviceValues -}}
{{- $migrationsBackoffLimit := dig "migrations" "backoffLimit" 0 $serviceValues -}}
{{- $migrationsEnv := dig "migrations" "env" list $serviceValues -}}
{{- if and $serviceValues.enabled $migrationsRunAsJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "secure-connection.fullname" . }}-db-migrate
  labels:
    {{- include "secure-connection.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: {{ if $migrationsAutoCleanupSuccessfulJob }}before-hook-creation,hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: {{ $migrationsBackoffLimit | int }}
  template:
    metadata:
      labels:
        {{- include "secure-connection.labels" . | nindent 8 }}
        {{- with $migrationsPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $migrationsPodAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "secure-connection.fullname" . | quote }}
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: db-migrate
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "alembic"
        - "upgrade"
        - "head"
        envFrom:
        - configMapRef:
            name: {{ include "secure-connection.configmap.name" . | quote }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- /* Chart identity blocks FIRST (always present); user env AFTER so it wins on
        duplicate names; migrations.env after service env; deduped last-wins so a repeated name
        collapses to one patchable entry. */}}
        {{- $env := include "istari-platform.workloadIdentityEnv" (dict "service" "secure-connection" "subservice" "db-migrate" "containerName" "db-migrate" "jaegerEnabled" $jaegerEnabled) | fromYamlArray }}
        {{- with $serviceValues.env }}{{- $env = concat $env . }}{{- end }}
        {{- with $migrationsEnv }}{{- $env = concat $env . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $env = concat $env (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.dedupeEnv" $env | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
