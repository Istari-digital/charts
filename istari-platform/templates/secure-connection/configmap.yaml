{{- /*
We put the generated default env vars in this config map so that user-defined values of
'secureConnection.secretName', 'secureConnection.extraEnvSecrets', and 'secureConnection.env' will always override them.
*/}}
{{- $serviceValues := .Values.secureConnection -}}
{{- if $serviceValues.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "secure-connection.configmap.name" . | quote }}
  labels:
    {{- include "secure-connection.labels" . | nindent 4 }}
  {{- if dig "migrations" "runAsJob" false $serviceValues }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
  {{- end }}
data:
  ISTARI_DIGITAL_REGISTRY_SERVICE_URL: {{ printf "http://%s" (include "fileservice.fullname" .) | quote }}
  {{- if or .Values.provisioner.enabled .Values.provisioner.external }}
  {{- /* A platform-client token carries its roles only from identity-service's v2 token endpoint.
  Set here rather than as explicit env so secureConnection.secretName/extraEnvSecrets/env can still
  override it, e.g. for an operator credential that needs a different path. */}}
  ISTARI_DIGITAL_IDENTITY_ROUTER_TOKEN_PATH: "/api/v2/oauth2/token"
  {{- end }}
  {{- if dig "enabled" false (default dict .Values.jaeger) }}
  {{- /* Per-container OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES are set as explicit env by
  "istari-platform.workloadIdentityEnv": the resource attributes reference downward-API $(VAR)s,
  which envFrom cannot expand, so they cannot live here. */}}
  ISTARI_DIGITAL_SECURE_CONNECTION_SERVICE_OPENTELEMETRY_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "istari-platform.jaeger.otlpUrl" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  {{- end }}
{{- end }}
