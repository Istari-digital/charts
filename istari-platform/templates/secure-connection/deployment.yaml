{{- $serviceValues := .Values.secureConnection -}}
{{- $migrationsEnv := dig "migrations" "env" list $serviceValues -}}
{{- $jaegerEnabled := dig "enabled" false (default dict .Values.jaeger) -}}
{{- if $serviceValues.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secure-connection.fullname" . | quote }}
  labels:
    {{- include "secure-connection.labels" . | nindent 4 }}
  {{- with $serviceValues.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $serviceValues.autoscaling.enabled }}
  replicas: {{ $serviceValues.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "secure-connection.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $serviceValues.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "secure-connection.labels" . | nindent 8 }}
        {{- with $serviceValues.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "secure-connection.fullname" . | quote }}
      {{- with $serviceValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default .Values.imagePullSecrets $serviceValues.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: "istari-platform"
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        ports:
        - containerPort: 8000
          name: "http"
          protocol: "TCP"
        livenessProbe:
          failureThreshold: 30
          httpGet:
            path: "/health/liveness"
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 8
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          failureThreshold: 30
          httpGet:
            path: "/health/readiness"
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 8
          successThreshold: 1
          timeoutSeconds: 10
        {{- with $serviceValues.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        {{- /*
        We put the generated default env vars in this config map so that user-defined values of
        'secureConnection.extraEnvConfigMaps', 'secureConnection.secretName', 'secureConnection.extraEnvSecrets', and 'secureConnection.env' will always override them.
        */}}
        - configMapRef:
            name: {{ include "secure-connection.configmap.name" . | quote }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order and deduped last-wins, so service env overrides a chart default and a repeated name
        collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "secure-connection" "subservice" "web" "containerName" "istari-platform" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- if not (dig "migrations" "runAsJob" false $serviceValues) }}
      initContainers:
      - name: "init-db"
        {{- with $serviceValues.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ printf "%s/%s:%s" $serviceValues.registry $serviceValues.image $serviceValues.tag | quote }}
        imagePullPolicy: {{ $serviceValues.imagePullPolicy | quote }}
        command:
        - "alembic"
        - "upgrade"
        - "head"
        envFrom:
        {{- /*
        We put the generated default env vars in this config map so that user-defined values of
        'secureConnection.extraEnvConfigMaps', 'secureConnection.secretName', 'secureConnection.extraEnvSecrets', and 'secureConnection.env' will always override them.
        */}}
        - configMapRef:
            name: {{ include "secure-connection.configmap.name" . | quote }}
        {{- with $serviceValues.extraEnvConfigMaps }}
        {{- range . }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if $serviceValues.secretName }}
        - secretRef:
            name: {{ $serviceValues.secretName | quote }}
        {{- end }}
        {{- with $serviceValues.extraEnvSecrets }}
        {{- range . }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- /* Chart identity/OTEL defaults render first; the fragments below are appended in
        order (service env, then migrations.env, then cert) and deduped last-wins, so later
        fragments override earlier ones and a repeated name collapses to one patchable entry. */}}
        {{- $extra := list }}
        {{- with $serviceValues.env }}{{- $extra = append $extra . }}{{- end }}
        {{- with $migrationsEnv }}{{- $extra = append $extra . }}{{- end }}
        {{- if .Values.trustedCertBundle }}{{- $extra = append $extra (include "istari-platform.trustedCertEnv" . | fromYamlArray) }}{{- end }}
        env:
        {{- include "istari-platform.containerEnv" (dict "service" "secure-connection" "subservice" "init-db" "containerName" "init-db" "otelDefaults" $jaegerEnabled "extra" $extra) | nindent 8 }}
        {{- if or $serviceValues.volumeMounts .Values.trustedCertBundle }}
        volumeMounts:
        {{- with $serviceValues.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.trustedCertBundle }}
        - name: trusted-certs
          mountPath: /usr/lib/ssl/cert.pem
          subPath: bundle.crt
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if or $serviceValues.volumes .Values.trustedCertBundle }}
      volumes:
      {{- with $serviceValues.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.trustedCertBundle }}
      - name: trusted-certs
        configMap:
          name: {{ include "shared.trustedCerts.name" . | quote }}
      {{- end }}
      {{- end }}
      {{- with $serviceValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $serviceValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
