{{- $serviceValues := .Values.apiGateway -}}
{{- if (include "istari-platform.apiGatewayEnabled" $) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-gateway.fullname" . | quote }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  {{- with $serviceValues.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
